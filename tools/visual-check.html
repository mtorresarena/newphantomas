<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Phantomas · revisión visual de la aventura</title>
  <style>
    *{box-sizing:border-box}
    html{color-scheme:dark;background:#080c1b;color:#e8eef8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{margin:0;padding:22px 20px 30px}
    main{width:100%;max-width:1200px;margin:auto}
    header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
    h1{font-size:18px;font-weight:650;margin:0;letter-spacing:.02em}
    header p{font-size:12px;color:#9aaac8;margin:0}
    nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    button{font:inherit;font-size:12px;font-weight:600;line-height:1.3;color:#d9e4f7;background:#121c34;border:1px solid #344361;padding:9px 13px;border-radius:5px;cursor:pointer}
    button:hover{border-color:#31d7e8;color:#fff}
    button:focus-visible{outline:2px solid #31d7e8;outline-offset:3px}
    button[aria-pressed="true"]{background:#113443;border-color:#31d7e8;color:#c6fcff}
    button:disabled{opacity:.4;cursor:wait}
    #compare{margin-left:auto}
    iframe{width:100%;aspect-ratio:5/3;display:block;border:0;background:#030614;box-shadow:0 14px 50px #0005}
    #status{font-size:12px;color:#9aacc9;min-height:18px;margin:13px 0 0}
    #status.error{color:#ff8a9a}
    @media(max-width:650px){body{padding:14px 10px}#compare{margin-left:0}header p{line-height:1.5}}
    body.capture{padding:0;overflow:hidden}
    body.capture main{max-width:none;height:100vh;display:flex;align-items:center;justify-content:center}
    body.capture header,body.capture nav,body.capture #status{display:none}
    body.capture iframe{width:min(100vw,calc(100vh * 5 / 3));height:min(100vh,calc(100vw * 3 / 5));box-shadow:none}
    body.capture.touchTest iframe{width:100vw;height:100vh}
    body.capture #status.error{display:block;position:fixed;bottom:0;left:0;background:#301020;padding:12px;z-index:20}
  </style>
</head>
<body>
<main>
  <header>
    <h1>PHANTOMAS · revisión visual</h1>
    <p>Escenas fijas de los cuatro niveles y sus enemigos.</p>
  </header>
  <nav aria-label="Escenas de revisión">
    <button type="button" data-view="garden" aria-pressed="false" disabled>Vista inicial</button>
    <button type="button" data-view="acid" aria-pressed="true" disabled>Zona del ácido</button>
    <button type="button" data-view="interior" aria-pressed="false" disabled>Interior</button>
    <button type="button" data-view="title" aria-pressed="false" disabled>Título</button>
    <button type="button" id="compare" disabled>Comparar aspecto</button>
  </nav>
  <iframe id="gameFrame" title="Vista de Phantomas para revisión visual" allow="autoplay; fullscreen"></iframe>
  <p id="status" role="status" aria-live="polite">Cargando el juego y sus recursos…</p>
</main>
<script>
  'use strict';
  const frame = document.getElementById('gameFrame');
  const status = document.getElementById('status');
  const buttons = [...document.querySelectorAll('button')];
  const viewButtons = [...document.querySelectorAll('[data-view]')];
  const labels = {intro:'Introducción',pause:'Pausa',over:'Fin de partida',clear:'Nivel completado',garden:'Vista inicial',acid:'Zona del ácido',interior:'Interior',title:'Título'};
  for(const name of ['hall','library','crypt','tower','moat','court','armory','dungeon','bell','coffin','keep','roof','roof2','roof3','bridges','attic','warehouse','sewer','museum','egypt','gallery','archive','ballroom','vault']){labels['zone:'+name]=name;const b=document.createElement('button');b.type='button';b.dataset.view='zone:'+name;b.textContent=name;b.disabled=true;document.querySelector('nav').append(b);buttons.push(b);viewButtons.push(b);}labels.enemies='Enemigos';const eb=document.createElement('button');eb.type='button';eb.dataset.view='enemies';eb.textContent='Enemigos';eb.disabled=true;document.querySelector('nav').append(eb);buttons.push(eb);viewButtons.push(eb);
  const options = new URLSearchParams(location.search);
  const capture = options.get('capture');
  if(capture)document.body.classList.add('capture');
  if(options.get('touch')==='1')document.body.classList.add('touchTest');
  let api = null;
  let currentView = 'acid';
  let renewed = true;

  function report(message, isError = false) {
    status.textContent = message;
    status.classList.toggle('error', isError);
  }
  window.addEventListener('message',event=>{if(event.source===frame.contentWindow&&event.data?.visualError)report(event.data.visualError,true);});

  function updateStatus() {
    report(labels[currentView] + ' · ' + (renewed ? 'Aspecto renovado' : 'Aspecto anterior') + ' · Escena detenida');
  }

  function selectView(mode) {
    try {
      api.preview(mode);
      currentView = mode;
      viewButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === mode)));
      updateStatus();
    } catch (error) {
      report('No se pudo mostrar la escena: ' + error.message, true);
    }
  }

  viewButtons.forEach(button => button.addEventListener('click', () => selectView(button.dataset.view)));
  document.getElementById('compare').addEventListener('click', () => {
    try {
      api.compareLook();
      renewed = !renewed;
      updateStatus();
    } catch (error) {
      report('No se pudo cambiar el aspecto: ' + error.message, true);
    }
  });

  frame.addEventListener('load', () => {
    // The iframe runs this project's own HTML on the same local origin.
    // Read the callback after load, when its scripts and image resources exist.
    try {
      const candidate = frame.contentWindow.visualGame;
      if (!candidate) return;
      if (typeof candidate.preview !== 'function' || typeof candidate.compareLook !== 'function') {
        throw new Error('La API visual preview/compareLook todavía no está disponible.');
      }
      api = candidate;
      buttons.forEach(button => {button.disabled = false;});
      selectView(labels[capture] ? capture : 'acid');
      if(options.get('look')==='classic'){api.compareLook();renewed=false;updateStatus();}
      if(options.get('sweep')==='1'){
        const run=async()=>{try{
          const art=frame.contentWindow.WorldArt;
          for(let attempt=0;attempt<100&&!['scenery','enemies','props'].every(n=>art.ready(n));attempt++)await new Promise(r=>setTimeout(r,100));
          if(!['scenery','enemies','props'].every(n=>art.ready(n)))throw Error('Faltan atlas por cargar');
          let count=0;for(const mode of Object.keys(labels)){api.preview(mode);api.compareLook();api.compareLook();count++;await new Promise(r=>setTimeout(r,30));}
          report('OK: '+count+' vistas renderizadas en ambos aspectos. Tres atlas cargados. Caché: '+art.cacheSize+' imágenes.');
        }catch(e){report('FALLO: '+e.message,true);}};run();
      }
    } catch (error) {
      report(error.message, true);
    }
  });

  async function loadGame() {
    if (!/^https?:$/.test(location.protocol)) {
      report('Abre esta página desde el servidor local del proyecto para cargar el juego.', true);
      return;
    }
    try {
      const baseURL = new URL('../', location.href);
      const response = await fetch(new URL('index.html', baseURL), {cache:'no-store'});
      if (!response.ok) throw new Error('No se pudo leer index.html (HTTP ' + response.status + ').');
      const source = await response.text();
      const gameDocument = new DOMParser().parseFromString(source, 'text/html');
      gameDocument.querySelectorAll('base').forEach(base => base.remove());
      const base = gameDocument.createElement('base');
      base.href = baseURL.href;
      gameDocument.head.prepend(base);
      const prelude = gameDocument.createElement('script');
      prelude.textContent = 'window.__PHANTOMAS_TEST__ = function(api) { window.visualGame = api; };const previewStorage=new Map();Object.defineProperty(window,"localStorage",{value:{getItem:k=>previewStorage.get(k)||null,setItem:(k,v)=>previewStorage.set(k,String(v)),removeItem:k=>previewStorage.delete(k)}});';
      prelude.textContent += 'window.addEventListener("error",e=>parent.postMessage({visualError:e.message},"*"));';
      if(options.get('touch')==='1')prelude.textContent += "const nativeMatchMedia=window.matchMedia.bind(window);window.matchMedia=q=>q==='(pointer:coarse)'?{matches:true}:nativeMatchMedia(q);window.ontouchstart=null;";
      base.after(prelude);
      if(capture&&options.get('controls')!=='1'){const style=gameDocument.createElement('style');style.textContent='#lookToggle{display:none}';gameDocument.head.append(style);}
      frame.srcdoc = '<!doctype html>\n' + gameDocument.documentElement.outerHTML;
      window.setTimeout(() => {
        if (!api) report('El juego no ha expuesto la API visual. Revisa los errores de carga y vuelve a abrir esta página.', true);
      }, 15000);
    } catch (error) {
      report('Error de carga: ' + error.message, true);
    }
  }

  loadGame();
</script>
</body>
</html>
