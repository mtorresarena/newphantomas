<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Phantomas · revisión visual de la aventura</title>
  <style>
    *{box-sizing:border-box}
    html{color-scheme:dark;background:#080c1b;color:#e8eef8;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{margin:0;padding:22px 20px 30px}
    main{width:100%;max-width:1200px;margin:auto}
    header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
    h1{font-size:18px;font-weight:650;margin:0;letter-spacing:.02em}
    header p{font-size:12px;color:#9aaac8;margin:0}
    nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    button{font:inherit;font-size:12px;font-weight:600;line-height:1.3;color:#d9e4f7;background:#121c34;border:1px solid #344361;padding:9px 13px;border-radius:5px;cursor:pointer}
    button:hover{border-color:#31d7e8;color:#fff}
    button:focus-visible{outline:2px solid #31d7e8;outline-offset:3px}
    button[aria-pressed="true"]{background:#113443;border-color:#31d7e8;color:#c6fcff}
    button:disabled{opacity:.4;cursor:wait}
    #compare{margin-left:auto}
    iframe{width:100%;aspect-ratio:5/3;display:block;border:0;background:#030614;box-shadow:0 14px 50px #0005}
    #status{font-size:12px;color:#9aacc9;min-height:18px;margin:13px 0 0}
    #status.error{color:#ff8a9a}
    @media(max-width:650px){body{padding:14px 10px}#compare{margin-left:0}header p{line-height:1.5}}
    body.capture{padding:0;overflow:hidden}
    body.capture main{max-width:none;height:100vh;display:flex;align-items:center;justify-content:center}
    body.capture header,body.capture nav,body.capture #status{display:none}
    body.capture iframe{width:min(100vw,calc(100vh * 5 / 3));height:min(100vh,calc(100vw * 3 / 5));box-shadow:none}
    body.capture.touchTest iframe{width:100vw;height:100vh}
    body.capture #status.error{display:block;position:fixed;bottom:0;left:0;background:#301020;padding:12px;z-index:20}
  </style>
</head>
<body>
<main>
  <header>
    <h1>PHANTOMAS · revisión visual</h1>
    <p>Escenas fijas de los ocho niveles y sus enemigos.</p>
  </header>
  <nav aria-label="Escenas de revisión">
    <button type="button" data-view="garden" aria-pressed="false" disabled>Vista inicial</button>
    <button type="button" data-view="acid" aria-pressed="true" disabled>Zona del ácido</button>
    <button type="button" data-view="interior" aria-pressed="false" disabled>Interior</button>
    <button type="button" data-view="title" aria-pressed="false" disabled>Título</button>
    <button type="button" id="compare" disabled>Comparar aspecto</button>
  </nav>
  <iframe id="gameFrame" title="Vista de Phantomas para revisión visual" allow="autoplay; fullscreen"></iframe>
  <p id="status" role="status" aria-live="polite">Cargando el juego y sus recursos…</p>
</main>
<script>
  'use strict';
  const frame = document.getElementById('gameFrame');
  const status = document.getElementById('status');
  const buttons = [...document.querySelectorAll('button')];
  const viewButtons = [...document.querySelectorAll('[data-view]')];
  const labels = {intro:'Introducción',pause:'Pausa',over:'Fin de partida',clear:'Nivel completado',garden:'Vista inicial',acid:'Zona del ácido',interior:'Interior',title:'Título',boss:'El Custodio'};
  for(const name of ['hall','library','crypt','tower','moat','court','armory','dungeon','bell','coffin','keep','roof','roof2','roof3','bridges','attic','warehouse','sewer','museum','egypt','gallery','archive','ballroom','vault','boss','statues','clocktower','observatory','heart']){labels['zone:'+name]=name;const b=document.createElement('button');b.type='button';b.dataset.view=name==='boss'?'boss':'zone:'+name;b.textContent=name==='boss'?'Jefe (Custodio)':name;b.disabled=true;document.querySelector('nav').append(b);buttons.push(b);viewButtons.push(b);}labels.enemies='Enemigos';const eb=document.createElement('button');eb.type='button';eb.dataset.view='enemies';eb.textContent='Enemigos';eb.disabled=true;document.querySelector('nav').append(eb);buttons.push(eb);viewButtons.push(eb);
  for(let li=4;li<8;li++)for(let si=0;si<10;si+=2)for(const offset of (li===7&&si===8?[0,.25,.5,.75,1]:[0,.5,1])){
    const mode='room:'+li+':'+si+':'+offset;labels[mode]='N'+(li+1)+' parte '+(si/2+1)+' · '+({0:'entrada',0.25:'guardia',0.5:'centro',0.75:'ascenso',1:'salida'}[offset]);
    const b=document.createElement('button');b.type='button';b.dataset.view=mode;b.textContent=labels[mode];b.disabled=true;document.querySelector('nav').append(b);buttons.push(b);viewButtons.push(b);
  }
  for(let li=4;li<8;li++){const mode='goal:'+li;labels[mode]='Meta N'+(li+1);const b=document.createElement('button');b.type='button';b.dataset.view=mode;b.textContent=labels[mode];b.disabled=true;document.querySelector('nav').append(b);buttons.push(b);viewButtons.push(b);}
  labels['expansion-enemies']='Enemigos nuevos';const ae=document.createElement('button');ae.type='button';ae.dataset.view='expansion-enemies';ae.textContent='Enemigos nuevos';ae.disabled=true;document.querySelector('nav').append(ae);buttons.push(ae);viewButtons.push(ae);
  const options = new URLSearchParams(location.search);
  for(const mode of ['heart-boss:warn','heart-boss:attack','heart-boss:open','heart-boss:defeat','trial:4:2','trial:7:3',...Array.from({length:4},(_,i)=>'trial:'+(i+4)+':0'),...Array.from({length:4},(_,i)=>'trial:'+(i+4)+':9')]){labels[mode]=mode;const b=document.createElement('button');b.type='button';b.dataset.view=mode;b.textContent=mode;b.disabled=true;document.querySelector('nav').append(b);buttons.push(b);viewButtons.push(b);}
  const capture = options.get('capture');
  if(capture)document.body.classList.add('capture');
  if(options.get('touch')==='1')document.body.classList.add('touchTest');
  let api = null;
  let currentView = 'acid';
  let renewed = true;

  function report(message, isError = false) {
    status.textContent = message+(options.get('metrics')==='1'?' · '+JSON.stringify({child:[frame.contentWindow?.innerWidth,frame.contentWindow?.innerHeight],canvas:frame.contentDocument?.querySelector('#c')?.getBoundingClientRect().toJSON()}):'');
    status.classList.toggle('error', isError);
  }
  window.addEventListener('message',event=>{if(event.source===frame.contentWindow&&event.data?.visualError)report(event.data.visualError,true);});

  function updateStatus() {
    report(labels[currentView] + ' · ' + (renewed ? 'Aspecto renovado' : 'Aspecto anterior') + ' · Escena detenida');
  }

  function selectView(mode) {
    try {
      api.preview(mode);
      currentView = mode;
      viewButtons.forEach(button => button.setAttribute('aria-pressed', String(button.dataset.view === mode)));
      updateStatus();
      frame.focus();
      frame.contentWindow?.focus();
    } catch (error) {
      report('No se pudo mostrar la escena: ' + error.message, true);
    }
  }

  viewButtons.forEach(button => button.addEventListener('click', () => selectView(button.dataset.view)));
  window.addEventListener('keydown', e => {
    if (e.target !== frame && frame.contentWindow && !['F5','F12','r'].includes(e.key)) {
      frame.contentWindow.dispatchEvent(new KeyboardEvent('keydown', {code: e.code, key: e.key, altKey: e.altKey, ctrlKey: e.ctrlKey, shiftKey: e.shiftKey, repeat: e.repeat}));
    }
  });
  window.addEventListener('keyup', e => {
    if (e.target !== frame && frame.contentWindow) {
      frame.contentWindow.dispatchEvent(new KeyboardEvent('keyup', {code: e.code, key: e.key, altKey: e.altKey, ctrlKey: e.ctrlKey, shiftKey: e.shiftKey}));
    }
  });
  document.getElementById('compare').addEventListener('click', () => {
    try {
      api.compareLook();
      renewed = !renewed;
      updateStatus();
      frame.focus();
      frame.contentWindow?.focus();
    } catch (error) {
      report('No se pudo cambiar el aspecto: ' + error.message, true);
    }
  });

  frame.addEventListener('load', () => {
    // The iframe runs this project's own HTML on the same local origin.
    // Read the callback after load, when its scripts and image resources exist.
    try {
      const candidate = frame.contentWindow.visualGame;
      if (!candidate) return;
      if (typeof candidate.preview !== 'function' || typeof candidate.compareLook !== 'function') {
        throw new Error('La API visual preview/compareLook todavía no está disponible.');
      }
      api = candidate;
      for(const b of [...viewButtons]){if(b.dataset.view.startsWith('room:')){const [_,li,si]=b.dataset.view.split(':');if(!api.LEVELS[li]?.segs[si]){delete labels[b.dataset.view];b.remove();viewButtons.splice(viewButtons.indexOf(b),1);buttons.splice(buttons.indexOf(b),1);}}}
      buttons.forEach(button => {button.disabled = false;});
      selectView(labels[capture] ? capture : 'acid');
      if(options.get('look')==='classic'){api.compareLook();renewed=false;updateStatus();}
      if(options.has('replay')){(async()=>{try{
       const ready=()=>frame.contentWindow.CampaignBossArt?.ready()&&frame.contentWindow.CampaignFoeArt?.ready()&&frame.contentWindow.WorldArt?.ready('enemies')&&(options.get('renderer')==='canvas'||frame.contentWindow.PhantomasPixi?.ready);
       for(let n=0;n<150&&!ready();n++)await new Promise(r=>setTimeout(r,100));
       if(!ready())throw Error('No se han cargado los recursos para capturar el replay');
       const li=Number(options.get('replay'))-1,stop=Number(options.get('at')||Infinity),policy=['cautious','speed'].includes(options.get('policy'))?'-'+options.get('policy'):'',record=options.get('record'),round=/^[1-9][0-9]*$/.test(options.get('round')||'')?options.get('round'):'3',w=await fetch(record&&/^route-n[5-8][-a-z0-9]*$/.test(record)?'../review/campaign-v3/round'+round+'/'+record+'.json':'../review/campaign-v3/route-n'+(li+1)+policy+'.json').then(r=>r.json());
       api.newGame();api.loadLevel(li);api.startLevel();let frames=0;
       for(const c of w.commands){for(const k of Object.keys(api.keys))api.keys[k]=false;api.keys.ArrowRight=c.a[0]>0;api.keys.ArrowLeft=c.a[0]<0;api.keys.Space=!!c.a[1];api.keys.ArrowDown=!!c.a[2];for(let f=0;f<c.frames&&api.state==='play'&&frames<stop;f++){api.step();api.parts.length=0;frames++;}if(frames>=stop||api.state==='clear')break;}
       if(options.get('pause')==='1')frame.contentWindow.dispatchEvent(new frame.contentWindow.KeyboardEvent('keydown',{code:'KeyP',bubbles:true}));
       api.render();report('Replay real N'+(li+1)+' · frame '+frames+' · '+api.state+' · energía '+api.player.energy.toFixed(1));
       if(options.get('proof')==='1'){
        // Export the actual composited game canvases in this same render turn,
        // before WebGL discards its drawing buffer. This is a world-frame
        // artifact, not a screenshot of the surrounding HTML controls/help.
        const d=frame.contentDocument,base=d.querySelector('#c'),out=document.createElement('canvas');out.width=base.width;out.height=base.height;
        const g=out.getContext('2d');g.fillStyle='#05060f';g.fillRect(0,0,out.width,out.height);
        for(const c of d.querySelectorAll('#wrap canvas'))if(frame.contentWindow.getComputedStyle(c).display!=='none')g.drawImage(c,0,0,out.width,out.height);
        const proof=document.createElement('img');proof.id='worldProof';proof.alt='Fotograma exportado de los lienzos del juego';proof.src=out.toDataURL('image/png');proof.style.cssText='max-width:100vw;max-height:100vh;object-fit:contain';frame.style.display='none';frame.after(proof);
       }
       // Replay disables the game's RAF. Redraw after resize without stepping
       // the simulation; production's normal RAF supplies this redraw itself.
       const frozen=JSON.stringify({frame:api.simF,x:api.player.x,y:api.player.y,energy:api.player.energy,state:api.state});
       frame.contentWindow.addEventListener('resize',()=>setTimeout(()=>{const unchanged=JSON.stringify({frame:api.simF,x:api.player.x,y:api.player.y,energy:api.player.energy,state:api.state})===frozen;api.render();report('Replay tras giro · '+api.state+' · simulación '+(unchanged?'sin cambios':'MODIFICADA'),!unchanged);},250));
      }catch(e){report(e.message,true);}})();}
      if(options.get('sweep')==='1'){
        const run=async()=>{try{
          const art=frame.contentWindow.WorldArt;
          const campaignArtReady=()=>frame.contentWindow.CampaignBossArt?.ready()&&frame.contentWindow.CampaignFoeArt?.ready();
          for(let n=0;n<100&&!campaignArtReady();n++)await new Promise(r=>setTimeout(r,100));
          if(!campaignArtReady())throw Error('Faltan atlas del corazón o sus enemigos');
          for(let attempt=0;attempt<100&&!['scenery','enemies','props','expansion'].every(n=>art.ready(n));attempt++)await new Promise(r=>setTimeout(r,100));
          if(!['scenery','enemies','props','expansion'].every(n=>art.ready(n)))throw Error('Faltan atlas por cargar');
          for(let n=0;n<100&&!(frame.contentWindow.ExpansionArt?.ready()&&frame.contentWindow.ExpansionArt?.propsReady());n++)await new Promise(r=>setTimeout(r,100));if(!(frame.contentWindow.ExpansionArt?.ready()&&frame.contentWindow.ExpansionArt?.propsReady()))throw Error('Falta atlas de enemigos o trofeos nuevos');
          const pixi=frame.contentWindow.PhantomasPixi;if(!pixi&&options.get('renderer')!=='canvas')throw Error("Falta la capa PixiJS");for(let attempt=0;attempt<150&&pixi&&!pixi.ready&&!pixi.error;attempt++)await new Promise(r=>setTimeout(r,100));if(pixi&&!pixi.ready)throw Error('PixiJS no pudo iniciar');
          let count=0;for(const mode of Object.keys(labels)){api.preview(mode);api.compareLook();api.compareLook();if(pixi&&mode!=='title'&&(!pixi.active||pixi.error))throw Error('PixiJS inactivo en '+mode);count++;await new Promise(r=>setTimeout(r,30));}
          report('OK: '+count+' vistas renderizadas en ambos aspectos · '+(pixi?'PixiJS activo':'Canvas sin PixiJS')+'. Atlas originales y expansión cargados. Caché: '+art.cacheSize+' imágenes.');
        }catch(e){report('FALLO: '+e.message,true);}};run();
      }
    } catch (error) {
      report(error.message, true);
    }
  });

  async function loadGame() {
    if (!/^https?:$/.test(location.protocol)) {
      report('Abre esta página desde el servidor local del proyecto para cargar el juego.', true);
      return;
    }
    try {
      const baseURL = new URL('../', location.href);
      const response = await fetch(new URL('index.html', baseURL), {cache:'no-store'});
      if (!response.ok) throw new Error('No se pudo leer index.html (HTTP ' + response.status + ').');
      const source = await response.text();
      const gameDocument = new DOMParser().parseFromString(source, 'text/html');
      if(options.get('renderer')==='canvas')gameDocument.querySelectorAll('script[src*="pixi-world"]').forEach(s=>s.remove());
      gameDocument.querySelectorAll('base').forEach(base => base.remove());
      const base = gameDocument.createElement('base');
      base.href = baseURL.href;
      gameDocument.head.prepend(base);
      const prelude = gameDocument.createElement('script');
      prelude.textContent = 'window.__PHANTOMAS_TEST__ = function(api) { window.visualGame = api; };const previewStorage=new Map();Object.defineProperty(window,"localStorage",{value:{getItem:k=>previewStorage.get(k)||null,setItem:(k,v)=>previewStorage.set(k,String(v)),removeItem:k=>previewStorage.delete(k)}});';
      prelude.textContent += 'window.addEventListener("error",e=>parent.postMessage({visualError:e.message},"*"));';
      if(options.has('replay'))prelude.textContent += 'window.requestAnimationFrame=()=>0;window.setInterval=()=>0;';
      if(options.get('touch')==='1')prelude.textContent += "const nativeMatchMedia=window.matchMedia.bind(window);window.matchMedia=q=>q==='(pointer:coarse)'?{matches:true}:nativeMatchMedia(q);window.ontouchstart=null;";
      base.after(prelude);
      if(capture&&options.get('controls')!=='1'){const style=gameDocument.createElement('style');style.textContent='#lookToggle{display:none}';gameDocument.head.append(style);}
      frame.srcdoc = '<!doctype html>\n' + gameDocument.documentElement.outerHTML;
      window.setTimeout(() => {
        if (!api) report('El juego no ha expuesto la API visual. Revisa los errores de carga y vuelve a abrir esta página.', true);
      }, 15000);
    } catch (error) {
      report('Error de carga: ' + error.message, true);
    }
  }

  loadGame();
</script>
</body>
</html>
