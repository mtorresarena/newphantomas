<style>
  html,body{margin:0;height:100%;background:radial-gradient(ellipse at center,#141a34 0%,#05060f 70%);overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  /* --pad: tamaño del boton, proporcional a la pantalla; --sb/--ss: area segura (notch) */
  :root{--pad:64px;--sb:env(safe-area-inset-bottom,0px);--sl:env(safe-area-inset-left,0px);--sr:env(safe-area-inset-right,0px)}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{background:#000;display:block;border-radius:6px;box-shadow:0 0 60px rgba(40,60,160,.35)}
  #touch{position:fixed;inset:0;display:none;pointer-events:none;z-index:5}
  #touch div{position:absolute;border-radius:50%;background:rgba(255,255,255,.13);border:2px solid rgba(255,255,255,.38);
    color:#fff;font:600 calc(var(--pad)*.30)/1 system-ui,sans-serif;display:flex;align-items:center;justify-content:center;
    pointer-events:auto;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);box-shadow:0 2px 10px rgba(0,0,0,.4);transition:background .08s,transform .08s}
  #touch div:active{background:rgba(255,210,58,.4);transform:scale(.94)}
  /* Safari: holding a control must not start text selection or a callout. */
  #touch,#touch *,#c,#lookToggle{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:none}
  /* cruceta abajo a la izquierda */
  #tl{left:calc(var(--sl) + var(--pad)*.25);bottom:calc(var(--sb) + var(--pad)*.55);width:var(--pad);height:var(--pad);font-size:calc(var(--pad)*.42)}
  #tr{left:calc(var(--sl) + var(--pad)*1.42);bottom:calc(var(--sb) + var(--pad)*.55);width:var(--pad);height:var(--pad);font-size:calc(var(--pad)*.42)}
  #td{left:calc(var(--sl) + var(--pad)*.84);bottom:calc(var(--sb) + var(--pad)*1.62);width:calc(var(--pad)*.8);height:calc(var(--pad)*.8);font-size:calc(var(--pad)*.34)}
  /* salto abajo a la derecha, separado de la cruceta */
  #tj{right:calc(var(--sr) + var(--pad)*.3);bottom:calc(var(--sb) + var(--pad)*.6);width:calc(var(--pad)*1.35);height:calc(var(--pad)*1.35);font-size:calc(var(--pad)*.24);letter-spacing:.5px}
  /* pausa y pantalla completa arriba, fuera del alcance de los pulgares */
  #tf{right:calc(var(--sr) + 10px);top:10px;bottom:auto;width:calc(var(--pad)*.62);height:calc(var(--pad)*.62);border-radius:10px;font-size:calc(var(--pad)*.30)}
  #tp{right:calc(var(--sr) + var(--pad)*.72 + 20px);top:10px;bottom:auto;left:auto;width:calc(var(--pad)*.62);height:calc(var(--pad)*.62);border-radius:10px;font-size:calc(var(--pad)*.26)}
  body.touch #touch{display:block}
  /* en vertical el lienzo sube y deja sitio libre a los mandos */
  body.touch.portrait #wrap{align-items:flex-start;padding-top:calc(env(safe-area-inset-top,0px) + 11vh)}
  #lookToggle{position:fixed;z-index:8;bottom:8px;left:50%;transform:translateX(-50%);padding:7px 12px;border:1px solid #66779966;background:#080d22dd;color:#dce9ff;font:600 11px/1.2 system-ui,sans-serif;border-radius:5px;cursor:pointer}
  #lookToggle:hover,#lookToggle:focus-visible{border-color:#37d7ec;color:#fff;outline:2px solid #37d7ec55;outline-offset:2px}
  body.touch #lookToggle{top:12px;bottom:auto;left:12px;transform:none;max-width:calc(100vw - 165px);font-size:10px}
  body.touch:not(.portrait) #lookToggle{top:auto;bottom:8px;left:50%;transform:translateX(-50%);max-width:none}
</style>

<script>
'use strict';
// =====================================================================
//  PHANTOMAS: LA MANSION DEL BARON  v1.5 (2026-09-07)
//  Plataformas horizontal inspirado en Phantomas (Dinamic, 1986).
//  Fisicas propias. Presentacion hibrida PixiJS/Canvas en assets/.
//  Mundo logico de 320x192 (tiles de 16 px); se conservan fisicas y mapas.
//  Fisicas fijas: salto 63 px de altura, ~67 px de alcance a nivel.
//  Los niveles se disenan para esas fisicas (ver tools/check-levels.js, que usa
//  la API window.__PHANTOMAS_TEST__ expuesta al final del script).
// =====================================================================
const W=320,H=192,TS=16,ROWS=12;
// Constantes de ajuste (las fisicas del jugador no se tocan)
const CFG={JV:5.5,GRAV:0.23,SPEED:1.5,MAXFALL:6.5,ACCEL:0.35,
 DRAIN:0.55/60,JUMP_COST:0.6,RECHARGE:16/60,BATTERY:35,LIVES:3,
 INV:80,INV_SPIKE:40,DMG_SPIKE:35,DMG_HIT:20,DMG_FLAME:15,DMG_RAT:10,KNOCK:2,
 GHOST_RANGE:150,GHOST_LOSE:320,GHOST_SPEED:0.38,VAMP_RANGE:190,VAMP_SPEED:0.55,GARLIC_RANGE:110,
 CANNON_CD:170,CANNON_RANGE:380,BALL_SPEED:1.7,BALL_LIFE:320,GUARD_SPEED:0.55,RAT_SPEED:1.1,MUMMY_SPEED:0.4,MUMMY_LURCH:0.95,MUMMY_RANGE:110,
 BAT_RANGE:60,SKULL_RANGE:60,SKULL_VX:0.9,SKULL_VY:-2.8,MOVER_H:48,MOVER_V:40,MOVER_FREQ:0.02,GHOST_RETURN:0.6,DAWN_GRACE:90,PLAT_TOL:0.6,BLINK:190,
 FRICTION_G:0.65,FRICTION_A:0.9,JUMP_CUT:-2.2,COYOTE:7,JBUF:7,INV_RESPAWN:120,ALARM_T:3600,ALARM_SPEED:1.8,ALARM_SPEED_RAT:1.4,
 BAT_FX:0.02,BAT_FY:0.09,BAT_AMP_Y:8,SPIDER_F:0.025,SPIDER_TOP:18,SPIDER_TOP_DAWN:28,GHOST_WOBBLE:0.1,VAMP_FLEE:0.7,SKULL_LOOK:24};
const S_ART=6; // resolucion de los lienzos prerrenderizados (se dibujan escalados a la pantalla)
function computeS(){const coarse=(typeof matchMedia==='function')&&matchMedia('(pointer:coarse)').matches;return Math.max(2,Math.min(coarse?4:6,Math.ceil(Math.min(innerWidth/W,innerHeight/H)*(window.devicePixelRatio||1))));}
let S=computeS();
const cv=document.getElementById('c');
let ctx=cv.getContext('2d');
// Optional presentation layer: the original simulation and test harness stay independent.
const WORLD=window.WorldArt;
const GARDEN=window.GardenArt, GARDEN_UI=window.GardenUI, GARDEN_TERRAIN=window.GardenTerrain;
const LOOK_AVAILABLE=!!(GARDEN&&GARDEN_UI&&GARDEN_TERRAIN);
let gardenLook=LOOK_AVAILABLE&&!/arte=clasico/.test(window.location?window.location.search:'');
const lookButton=document.getElementById('lookToggle');
function updateLookButton(){if(!lookButton)return;lookButton.hidden=!LOOK_AVAILABLE;lookButton.textContent=gardenLook?'Ver aspecto anterior · G':'Ver aspecto renovado · G';if(lookButton.setAttribute)lookButton.setAttribute('aria-pressed',String(gardenLook));}
function toggleLook(){if(!LOOK_AVAILABLE)return;gardenLook=!gardenLook;updateLookButton();}
if(lookButton)lookButton.addEventListener('click',e=>{toggleLook();if(e.detail>0&&lookButton.blur)lookButton.blur();});
updateLookButton();
// VH: alto visible del lienzo en unidades de mundo. En vertical se amplia (letterbox
// relleno con el propio cielo/muros) para que el juego se vea mucho mayor en el movil,
// sin tocar ni las fisicas ni los mapas: el mundo sigue siendo de 320x192.
let VH=H,vOff=0;
function fit(){const portrait=innerHeight>innerWidth;const touch=IS_TOUCH;
 const availH=(touch&&portrait)?innerHeight*0.63:innerHeight;
 let s,vh=H;
 if(touch&&portrait){s=innerWidth/W;vh=Math.min(H*1.75,Math.max(H,Math.round(availH/s)));}
 else s=Math.min(innerWidth/W,availH/H);
 if(vh!==VH){VH=vh;vOff=Math.round((VH-H)/2);if(typeof applyScale==='function'){applyScale(true);}else return;}
 cv.style.width=Math.floor(W*s)+'px';cv.style.height=Math.floor(VH*s)+'px';
 if(touch){document.body.classList.toggle('portrait',portrait);
  const pad=Math.round(Math.max(52,Math.min(96,Math.min(innerWidth,innerHeight)*(portrait?0.17:0.20))));
  document.documentElement.style.setProperty('--pad',pad+'px');}}
let IS_TOUCH=(typeof matchMedia==='function')&&matchMedia('(pointer:coarse)').matches&&('ontouchstart' in window);
function enableTouch(){if(IS_TOUCH)return;IS_TOUCH=true;document.body.classList.add('touch');fit();}
if(IS_TOUCH)addEventListener('DOMContentLoaded',()=>{document.body.classList.add('touch');fit();});
addEventListener('pointerdown',e=>{if(e.pointerType==='touch')enableTouch();},{capture:true,passive:true});

// ---------------- Paleta base (usada por logica y efectos) ----------------
const C={k:'#000000',b:'#3060ff',r:'#ff3040',m:'#d040ff',g:'#40e070',c:'#30e8ff',y:'#ffd23a',w:'#ffffff',
 B:'#2040c0',R:'#c02030',M:'#a030c0',G:'#20a040',Cy:'#20a0b0',Y:'#c0a020',Wd:'#c8ccd4',
 dc:'#1aa0b0',dm:'#6a2080',dg:'#1a1c22',gr:'#5a5e66',lg:'#a0a4ac',br:'#8b5a2b',dbr:'#4a2a0e',pk:'#ff88aa',bd:'#d8d0b0',bd2:'#a09878'};

// ---------------- Utilidades de dibujo ----------------
function mk(w,h,fn){const o=document.createElement('canvas');o.width=Math.ceil(w*S_ART);o.height=Math.ceil(h*S_ART);const x=o.getContext('2d');x.scale(S_ART,S_ART);fn(x,w,h);return o;}
function rrect(g,x,y,w,h,r,fill,stroke){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.lineTo(x+w-r,y);g.quadraticCurveTo(x+w,y,x+w,y+r);g.lineTo(x+w,y+h-r);g.quadraticCurveTo(x+w,y+h,x+w-r,y+h);g.lineTo(x+r,y+h);g.quadraticCurveTo(x,y+h,x,y+h-r);g.lineTo(x,y+r);g.quadraticCurveTo(x,y,x+r,y);g.closePath();if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.stroke();}}
function circ(g,x,y,r,fill,stroke){g.beginPath();g.arc(x,y,r,0,6.2832);if(fill){g.fillStyle=fill;g.fill();}if(stroke){g.strokeStyle=stroke;g.stroke();}}
function ell(g,x,y,rx,ry,fill,rot=0){g.beginPath();g.ellipse(x,y,rx,ry,rot,0,6.2832);g.fillStyle=fill;g.fill();}
function lgr(g,x0,y0,x1,y1,stops){const gr=g.createLinearGradient(x0,y0,x1,y1);stops.forEach((s,i)=>gr.addColorStop(i/(stops.length-1),s));return gr;}
function rgr(g,x,y,r,stops,x2,y2){const gr=g.createRadialGradient(x2===undefined?x:x2,y2===undefined?y:y2,0,x,y,r);stops.forEach((s,i)=>gr.addColorStop(i/(stops.length-1),s));return gr;}
function glow(g,x,y,r,col,a){g.fillStyle=rgr(g,x,y,r,['rgba('+col+','+a+')','rgba('+col+',0)']);g.fillRect(x-r,y-r,r*2,r*2);}
function hash(n){n=(n*2654435761)>>>0;return ((n>>>8)&0xffff)/0xffff;}

// ---------------- Texto (fuente del sistema, nitida a cualquier escala) ----------------
const FONT_MAIN='"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
function fsize(sc){return sc>=4?24:sc===3?17:sc===2?11:6.6;}
function text(s,x,y,col,sc=1,al='left'){if(gardenLook){GARDEN_UI.drawText(ctx,s,x,y,col,sc,al);return;}ctx.font='bold '+fsize(sc)+'px '+FONT_MAIN;ctx.textBaseline='top';ctx.textAlign=al;ctx.fillStyle=col;ctx.fillText(s,x,y);}
function textW(s,sc){if(gardenLook)return GARDEN_UI.textWidth(s,sc||1);ctx.font='bold '+fsize(sc)+'px '+FONT_MAIN;return ctx.measureText(s).width;}
function textS(s,x,y,col,sh,sc=1,al='left'){const d=sc>=2?1:0.6;text(s,x+d,y+d,sh,sc,al);text(s,x,y,col,sc,al);}

// ---------------- Arte procedural: personajes (alta resolucion, animados) ----------------
// Phantomas: cabeza esferica enorme con visor y ojos luminosos, cuerpo pequeno, piernas cortas (como el original)
function drawPhantomas(g,x,y,face,pose,t,opt={}){if(gardenLook&&GARDEN.drawRobot(g,x,y,face,pose,t,opt))return;g.save();g.translate(x+5,y+18);if(face<0)g.scale(-1,1);const sq=opt.squash||0;g.scale(1+sq,1-sq);
 const run=pose==='run',jump=pose==='jump'||pose==='fall',fall=pose==='fall',hurt=pose==='hurt';const ph=Math.sin(t*0.35);const white=!!opt.flash;const blink=!hurt&&((frame%CFG.BLINK)<5);
 const metal=white?'#fff':lgr(g,-5,-18,5,0,['#ffffff','#cfd8e6','#8a96aa']);const dark=white?'#fff':'#3a4252';
 if(!white)ell(g,0,0.6,5,1.4,'rgba(0,0,0,.35)');
 const idle=!run&&!jump&&!hurt;if(idle)g.translate(0,Math.sin(t*0.08)*0.35);
 const lA=fall?-3:jump?3:run?ph*2.2:0,lB=fall?3:jump?3:run?-ph*2.2:0;if(opt.tilt){g.rotate(opt.tilt*1.4);g.globalAlpha=Math.max(0.15,1-opt.tilt*0.8);}
 for(const [dx,off] of [[-2.6,lA],[2.6,lB]]){const lift=Math.max(0,off*0.3);rrect(g,dx-1.6,-3.6+lift,3.2,3.7-lift,1,white?'#fff':'#5a6478');rrect(g,dx-2,-1.4+lift,4,1.7,0.8,white?'#fff':'#2c3340');}
 rrect(g,-4,-8.6,8,6.3,2.2,metal);
 if(!white){rrect(g,-4,-4.2,8,1.9,1,'rgba(0,0,0,.18)');glow(g,0,-6,3.2,'38,230,255',.5);circ(g,0,-6,1.1,'#26e6ff');}
 const aA=fall?-5:jump?-3.5:hurt?-1.5:run?ph*1.8:0.2,aB=fall?-5:jump?3:hurt?-1.5:run?-ph*1.8:0.2;
 rrect(g,-6.2,-7.6+aA*0.4,2.2,4.4,1.1,metal);rrect(g,4,-7.6+aB*0.4,2.2,4.4,1.1,metal);circ(g,-5.1,-3.2+aA*0.4,1.3,dark);circ(g,5.1,-3.2+aB*0.4,1.3,dark);
 const hy=-12.6+(run?Math.abs(ph)*0.4:0);
 circ(g,0,hy,5.6,white?'#fff':rgr(g,0,hy,5.9,['#ffffff','#dde4ee','#9aa6ba','#5c6678'],-2,hy-2.4));
 if(!white){g.save();g.beginPath();g.arc(0,hy,5.6,0,6.2832);g.clip();g.fillStyle='#1c2230';g.fillRect(-6,hy-2.2,12,4.2);g.restore();
  if(hurt){g.strokeStyle='#ff5060';g.lineWidth=0.8;for(const ex of [-2.2,2.2]){g.beginPath();g.moveTo(ex-1,hy-1);g.lineTo(ex+1,hy+1);g.moveTo(ex+1,hy-1);g.lineTo(ex-1,hy+1);g.stroke();}}
  else if(blink){g.fillStyle='#60c8d8';for(const ex of [-2.2,2.2])g.fillRect(ex-1.1,hy-0.4,2.2,0.7);}
  else for(const ex of [-2.2,2.2]){glow(g,ex,hy-0.1,2.6,'60,240,255',.55);circ(g,ex,hy-0.1,1.15,'#c8ffff');}
  ell(g,-2.2,hy-3.4,1.6,0.9,'rgba(255,255,255,.55)',-0.6);}
 g.restore();}
function drawBat(g,x,y,t,dir){if(gardenLook&&GARDEN.drawBat(g,x,y,t,dir))return;g.save();g.translate(x+6,y+3.5);g.scale(1.25,1.25);if(dir<0)g.scale(-1,1);const f=Math.sin(t*0.45);
 g.fillStyle='#7a2aa0';for(const s of [-1,1]){g.beginPath();g.moveTo(s*2,0);g.quadraticCurveTo(s*5,-3-f*3,s*7.5,-1-f*2.5);g.quadraticCurveTo(s*6,1-f,s*4.5,0.5);g.quadraticCurveTo(s*3.5,2,s*2,1);g.closePath();g.fill();}
 ell(g,0,0.3,2.4,1.9,'#4a1868');circ(g,0,-0.6,1.7,'#5a2080');glow(g,0,-0.8,3,'255,60,60',.25);circ(g,-0.7,-0.8,0.45,'#ff4040');circ(g,0.7,-0.8,0.45,'#ff4040');g.restore();}
function drawSpider(g,x,y,t){if(gardenLook&&WORLD&&WORLD.enemy(g,'spider',x,y,t))return;g.save();g.translate(x+5,y+2.5);g.scale(1.25,1.25);g.strokeStyle='#1a1a1a';g.lineWidth=0.7;
 for(let i=0;i<4;i++){const k=Math.sin(t*0.3+i)*0.4;for(const s of [-1,1]){g.beginPath();g.moveTo(s*1.2,0);g.lineTo(s*(3.5+i*0.3),-1.5+i*1.1+k);g.lineTo(s*(5+i*0.2),1+i*0.6+k);g.stroke();}}
 circ(g,0,0.2,1.6,'#222');ell(g,0,2.4,2.2,1.8,'#2a2a2a');circ(g,0,2.2,0.7,'#e02020');circ(g,-0.6,-0.3,0.35,'#ff4040');circ(g,0.6,-0.3,0.35,'#ff4040');g.restore();}
function drawSkull(g,x,y,t){if(gardenLook&&GARDEN.drawSkull(g,x,y))return;g.save();g.translate(x+5,y+5);g.rotate(Math.sin(t*0.2)*0.12);circ(g,0,-0.8,4.4,rgr(g,0,-0.8,4.6,['#ffffff','#e8e6dc','#a8a498'],-1.5,-2.5));
 rrect(g,-2.8,2.2,5.6,2.6,1,'#e8e6dc');ell(g,-1.7,-1.2,1.3,1.5,'#1a1a22');ell(g,1.7,-1.2,1.3,1.5,'#1a1a22');g.fillStyle='#1a1a22';g.beginPath();g.moveTo(0,0.4);g.lineTo(-0.7,1.6);g.lineTo(0.7,1.6);g.closePath();g.fill();
 for(let i=-2;i<=2;i++)g.fillRect(i*1.1-0.3,2.6,0.6,1.6);g.restore();}
function drawGhost(g,x,y,t,alpha,active){if(gardenLook&&WORLD&&WORLD.enemy(g,'ghost',x,y,t,1,{alpha}))return;g.save();g.globalAlpha=alpha;g.translate(x+6,y);glow(g,0,7,12,'160,200,255',active?.35:.15);
 g.beginPath();g.moveTo(-6,7);g.lineTo(-6,4);g.arc(0,4,6,Math.PI,0);g.lineTo(6,7);for(let i=0;i<=6;i++){const px=6-i*2;g.lineTo(px,13+Math.sin(t*0.3+i*1.8)*1.2-((i%2)?1.5:0));}g.closePath();
 g.fillStyle=lgr(g,0,-2,0,14,['#ffffff','#dce8ff','rgba(180,200,255,.6)']);g.fill();
 ell(g,-2.2,3.5,1.1,1.6,'#20306a');ell(g,2.2,3.5,1.1,1.6,'#20306a');ell(g,0,7,1,0.7,'#20306a');g.restore();}
function drawGuard(g,x,y,t,dir,mummy){if(gardenLook&&WORLD&&WORLD.enemy(g,mummy?'mummy':'guard',x,y,t,dir))return;g.save();g.translate(x+5,y+18);if(dir<0)g.scale(-1,1);const ph=Math.sin(t*0.18);
 const steel=mummy?lgr(g,-5,-18,5,0,['#efe6c8','#cdbf98','#8f8264']):lgr(g,-5,-18,5,0,['#e6ecf5','#9fb0c6','#4f5d72']);const edge=mummy?'#6a5e44':'#2a3342';
 ell(g,0,0.6,5,1.3,'rgba(0,0,0,.3)');
 for(const [dx,o] of [[-2.4,ph*2],[2.4,-ph*2]]){const lift=Math.max(0,o*0.3);rrect(g,dx-1.7,-6+lift,3.4,6-lift,1,steel);rrect(g,dx-2,-1.4,4,1.8,0.6,edge);}

function buildLevel(def){const rows=Array(ROWS).fill('');const zones=[];let cx=0;
 for(const s of def.segs){const w=Math.max(...s.rows.map(r=>r.length));for(let r=0;r<ROWS;r++){let l=s.rows[r]||'';rows[r]+=l.length<w?l.padEnd(w,'.'):l.slice(0,w);}zones.push({x0:cx*TS,x1:(cx+w)*TS,t:s.t});cx+=w;}
 return {cols:cx,map:rows.map(r=>r.split('')),zones,W:cx*TS,def};}
let L=null;
function tileAt(c,r){if(r<0||r>=ROWS)return '.';if(c<0||c>=L.cols)return '#';return L.map[r][c];}
function isSolid(ch){return ch==='#'||ch==='%'||ch==='G'||ch==='D';}
function zoneAt(x){for(const z of L.zones)if(x>=z.x0&&x<z.x1)return z;return x<0?L.zones[0]:L.zones[L.zones.length-1];}
function themeAt(x){return THEMES[zoneAt(x).t];}

const audio={ctx:null,muted:false,
 init(){if(!this.ctx){try{this.ctx=new (window.AudioContext||window.webkitAudioContext)();this.master=this.ctx.createGain();this.master.gain.value=0.22;this.master.connect(this.ctx.destination);this.mgain=this.ctx.createGain();this.mgain.gain.value=1;this.mgain.connect(this.master);this.delay=this.ctx.createDelay(0.5);this.delay.delayTime.value=0.18;const fb=this.ctx.createGain();fb.gain.value=0.25;this.delay.connect(fb);fb.connect(this.delay);const dg=this.ctx.createGain();dg.gain.value=0.3;this.delay.connect(dg);dg.connect(this.mgain);}catch(e){}}
  if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume();},
 tone(f,dur,type='square',vol=1,f2=null,when=0,fx=false,bus=false){if(!this.ctx||this.muted)return;const t=this.ctx.currentTime+when;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g);g.connect(bus&&this.mgain?this.mgain:this.master);if(fx&&this.delay)g.connect(this.delay);o.start(t);o.stop(t+dur+0.02);},
 noiseBuf(){if(!this.nb){const n=this.ctx.sampleRate|0;const b=this.ctx.createBuffer(1,n,this.ctx.sampleRate);const d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;this.nb=b;}return this.nb;},
 noise(dur,vol=1,when=0,hp=0,bus=false){if(!this.ctx||this.muted)return;const t=this.ctx.currentTime+when;const s=this.ctx.createBufferSource();s.buffer=this.noiseBuf();const g=this.ctx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  let node=s;if(hp){const f=this.ctx.createBiquadFilter();f.type='highpass';f.frequency.value=hp;s.connect(f);node=f;}node.connect(g);g.connect(bus&&this.mgain?this.mgain:this.master);s.start(t,0,dur+0.02);}};

 textS(title,W/2,y0+6,col,'#000000',3,'center');lines.forEach((l,i)=>text(l,W/2,y0+32+i*9,i===lines.length-1&&((frame>>5)&1)?'rgba(0,0,0,0)':'#e8ecf4',1,'center'));}
function deathText(){return {energy:'PHANTOMAS SE QUEDA SIN ENERGÍA',hit:'PHANTOMAS CAE ANTE LOS GUARDIANES',cannon:'UNA BALA DE CAÑÓN ACABA CON PHANTOMAS',spike:'PHANTOMAS ACABA EN LOS PINCHOS',flame:'PHANTOMAS ARDE EN LAS LLAMAS',acid:'PHANTOMAS SE DISUELVE EN EL ÁCIDO',fall:'PHANTOMAS CAE AL VACÍO',dawn:'EL SOL DESCUBRE A PHANTOMAS'}[lastCause]||'PHANTOMAS CAE';}
function rank(b,t){const pc=t?b/t:0;if(pc>=1)return 'MAESTRO DEL ROBO';if(pc>=0.75)return 'LADRÓN DE GUANTE BLANCO';if(pc>=0.5)return 'RATERO CON FUTURO';if(pc>=0.25)return 'APRENDIZ DE CACO';return 'TURISTA NOCTURNO';}
function fmt(t){t=Math.floor(t);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0');}
function pct(b,t){return t?Math.round(100*b/t):0;}

// Reuse complete room artwork in two reusable Pixi textures. Physics and UI stay unchanged.
function paintLayer(target,layer,cx){
 const screen=ctx;ctx=target;
 try{if(layer==='back')drawBackground(cx);
 else{drawDecor(cx);drawTiles(cx);drawMovers(cx);drawItems(cx);drawEnts(cx);if(boss)drawBoss(cx);drawPlayer(cx);drawParts(cx);drawDark(cx);}}
 finally{ctx=screen;}
}
function render(){const cx=cam.x+(shake?(Math.random()-0.5)*shake:0);const sy=shake?(Math.random()-0.5)*shake*0.5:0;
 if(vOff>0){const t=themeAt(cam.x+W/2);ctx.fillStyle=t.sky?'#05060f':t.bg;ctx.fillRect(0,-vOff,W,VH);}
 const pixi=window.PhantomasPixi&&window.PhantomasPixi.render({cx,sy,frame,player,ents,items,parts,decor,L,VH,S,vOff,cv,gardenLook,THEMES,paintLayer,boss});
 if(pixi){ctx.clearRect(0,-vOff,W,VH);}else{ctx.save();ctx.translate(0,sy);drawBackground(cx);drawDecor(cx);drawTiles(cx);drawMovers(cx);drawItems(cx);drawEnts(cx);if(boss)drawBoss(cx);drawPlayer(cx);drawParts(cx);drawDark(cx);ctx.restore();}
 drawVignette();drawHUD();
 if(fadeT>0){ctx.fillStyle='rgba(0,0,0,'+(fadeT/30)+')';ctx.fillRect(0,0,W,H);}
 const d=L.def;
 if(state==='intro')drawOverlay('NIVEL '+(lvl+1),[d.name,'',...d.intro,'',...(lvl===0?['LA ENERGÍA BAJA SOLA: RECARGA EN LOS ENCHUFES',''] :[]),IS_TOUCH?'TOCA SALTO':'PULSA ESPACIO'],'#ffd23a');
 else if(state==='pause')drawOverlay('PAUSA',['',IS_TOUCH?'TOCA PARA SEGUIR':'PULSA P O ESPACIO PARA SEGUIR'],'#30e8ff');
 else if(state==='over'){drawOverlay('FIN DEL JUEGO',[deathText()+' EN EL NIVEL '+(lvl+1),'BOTÍN TOTAL: '+total.bags+(total.bags===1?' SACO':' SACOS')+'   TIEMPO: '+fmt(total.time+stats.time),'',''],'#ff3040');
  const bl=(frame>>5)&1;uiRects.cont={x:W/2-104,y:117,w:100,h:13};uiRects.title={x:W/2+4,y:117,w:100,h:13};
  rrect(ctx,uiRects.cont.x,117,100,13,4,bl?'rgba(255,210,58,.25)':'rgba(255,255,255,.12)','rgba(255,255,255,.4)');text((IS_TOUCH?'':'ESPACIO: ')+'SEGUIR (NIVEL '+(lvl+1)+')',uiRects.cont.x+50,120.2,'#ffffff',1,'center');
  rrect(ctx,uiRects.title.x,117,100,13,4,'rgba(255,255,255,.08)','rgba(255,255,255,.3)');text((IS_TOUCH?'':'T: ')+'VOLVER AL TÍTULO',uiRects.title.x+50,120.2,'#c8ccd4',1,'center');}
 else if(state==='clear'){const last=lvl===LEVELS.length-1;drawOverlay(last?'GOLPE MAESTRO':'NIVEL SUPERADO',[d.done||(d.goalName+' ES TUYO'),'BOTÍN: '+pct(stats.bags,stats.total)+'%  ('+stats.bags+'/'+stats.total+(stats.total===1?' SACO':' SACOS')+')   TIEMPO: '+fmt(stats.time),
   ...(last?['','TOTAL: '+pct(total.bags,total.total)+'%  '+total.bags+'/'+total.total+' SACOS   '+fmt(total.time),'MUERTES: '+total.deaths+'   RANGO: '+rank(total.bags,total.total),...(continued?['CONTINUACIONES: '+continued+' (NO CUENTA PARA EL RÉCORD)']:[]),total.bags>=total.total?'¡NADIE HA ROBADO TANTO EN UNA NOCHE!':'AÚN QUEDA BOTÍN POR AHÍ...']:['','RANGO: '+rank(stats.bags,stats.total)]),'',IS_TOUCH?'TOCA SALTO':'PULSA ESPACIO'],'#ffd23a');}}

// ---------------- Bucle ----------------
let acc=0,last=performance.now(),lastRaf=0;
function step(){frame++;tick++;pollGamepad();
 if(state==='title'){if(anyKey&&tick>20){anyKey=false;newGame();}}
 else if(state==='intro'){if(anyKey&&tick>30){anyKey=false;startLevel();}}
 else if(state==='play'){simF++;if(fadeT>0)fadeT--;updateMovers();updatePlayer();updateBoss();updateEnts();updateCam();}
 else if(state==='clear'){updateParts();if(anyKey&&tick>90){anyKey=false;if(lvl<LEVELS.length-1)loadLevel(lvl+1);else setState('title');}}
 else if(state==='over'){if(anyKey&&tick>90){anyKey=false;continueFrom(lvl,true);}}
 else if(state==='pause'){if(anyKey&&tick>15){anyKey=false;player.jHeld=true;player.jbuf=0;setState('play');}}
 anyKey=false;}
function tickLoop(now){acc+=Math.min(100,now-last);last=now;let dirty=false;while(acc>=1000/60){acc-=1000/60;step();dirty=true;}if(!dirty&&!shake)return;if(state==='title'){if(window.PhantomasPixi)window.PhantomasPixi.hide(cv);drawTitle();}else render();}
function loop(now){lastRaf=now;requestAnimationFrame(loop);tickLoop(now);}
requestAnimationFrame(loop);
// respaldo si el entorno no dispara requestAnimationFrame (webviews en segundo plano): mismo bucle con acumulador
setInterval(()=>{if(!document.hidden&&performance.now()-lastRaf>500)tickLoop(performance.now());},1000/60);
if(window.PhantomasPixi)window.startPixiGardenDemo=()=>{newGame();startLevel();clearInput();fadeT=0;zoneName.n=0;render();};
if(typeof window.__PHANTOMAS_TEST__==='function')window.__PHANTOMAS_TEST__({LEVELS,TS,ROWS,CFG,tileAt,isSolid,buildLevel,loadLevel,newGame,updatePlayer,updateMovers,updateEnts,updateBoss,keys,setState,startLevel,
 preview(mode){if(mode==='title'){setState('title');window.PhantomasPixi?.hide(cv);drawTitle();return;}newGame();startLevel();clearInput();fadeT=0;zoneName.n=0;frame=120;
  if(mode==='acid'){player.x=300;player.y=78;cam.x=180;}
  else if(mode==='interior'){player.x=864;player.y=142;cam.x=800;}
  else if(mode==='boss'){loadLevel(3);startLevel();clearInput();fadeT=0;zoneName.n=0;if(boss){boss.active=true;boss.state='aim';boss.timer=30;player.x=boss.x0+80;player.y=126;cam.x=boss.x0;}frame=120;}
  else if(mode.startsWith('zone:')){const name=mode.slice(5);const index=LEVELS.findIndex(def=>buildLevel(def).zones.some(z=>z.t===name));if(index<0)throw Error('Unknown zone '+name);loadLevel(index);startLevel();clearInput();fadeT=0;zoneName.n=0;const z=L.zones.find(z=>z.t===name);cam.x=Math.max(0,Math.min(L.cols*16-W,z.x0));player.x=cam.x+40;player.y=142;frame=120;}
  else if(mode==='enemies'){loadLevel(3);startLevel();clearInput();fadeT=0;zoneName.n=0;cam.x=0;ents=['w','u','r','a','g','v','n','f'].map((t,i)=>({t,x:35+i*34,y:110,w:12,h:18,ph:0,anim:12,dir:1,active:true,cd:0}));player.x=12;player.y=142;frame=120;}
  player.vx=player.vy=0;player.onGround=true;player.inv=0;setState(['intro','pause','over','clear'].includes(mode)?mode:'preview');render();},
 compareLook(){toggleLook();if(state==='title')drawTitle();else render();},
 get L(){return L},get player(){return player},get items(){return items},get parts(){return parts},get alarmT(){return alarmT},set alarmT(v){alarmT=v},get ents(){return ents},set ents(v){ents=v},get movers(){return movers},get state(){return state},get simF(){return simF},set simF(v){simF=v},get stats(){return stats},get check(){return check},get lvl(){return lvl},get boss(){return boss}});
